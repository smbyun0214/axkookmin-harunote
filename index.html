<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>하루노트</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23007aff'/><path d='M10 9h9l3 3v11H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/><path d='M13 16h6M13 20h4' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 저장해 둔 배경(흰색/검은색)을 화면이 그려지기 전에 먼저 적용합니다 -->
  <script>
    try {
      var savedTheme = localStorage.getItem('harunote-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 왼쪽 사이드바 메뉴 -->
  <aside class="sidebar" aria-label="메인 메뉴">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h8l3 3v13H7z"/><path d="M10 11h5M10 15h3"/></svg>
      </span>
      <span class="brand-name">하루노트</span>
    </div>

    <nav class="nav">
      <p class="nav-section">보기</p>
      <!-- 이 묶음 안의 메뉴는 마우스로 끌어서 순서를 바꿀 수 있습니다 (js/nav.js) -->
      <div class="nav-group" data-nav-group="views">
        <button type="button" class="nav-item" data-goto="today" title="오늘 (끌어서 순서 바꾸기)" draggable="true">
          <span class="tile" style="--tile: var(--blue)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></span>
          <span class="nav-label">오늘</span><span class="nav-count" data-count="today"></span>
        </button>
        <button type="button" class="nav-item" data-goto="todo" title="할 일 (끌어서 순서 바꾸기)" draggable="true">
          <span class="tile" style="--tile: var(--orange)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg></span>
          <span class="nav-label">할 일</span><span class="nav-count" data-count="todo"></span>
        </button>
        <button type="button" class="nav-item" data-goto="calendar" title="캘린더 (끌어서 순서 바꾸기)" draggable="true">
          <span class="tile" style="--tile: var(--red)"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
          <span class="nav-label">캘린더</span><span class="nav-count" data-count="calendar"></span>
        </button>
      </div>

      <p class="nav-section">기록</p>
      <button type="button" class="nav-item" data-goto="versions" title="히스토리">
        <span class="tile" style="--tile: var(--purple)"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 8.2v7.6M18 9.2c0 4.5-5 4.3-10.5 7.3"/></svg></span>
        <span class="nav-label">히스토리</span><span class="nav-count" data-count="versions"></span>
      </button>
      <button type="button" class="nav-item" data-goto="history" title="하루 기록">
        <span class="tile" style="--tile: var(--green)"><svg viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 0 7.5 21H19"/></svg></span>
        <span class="nav-label">하루 기록</span><span class="nav-count" data-count="history"></span>
      </button>
    </nav>

    <div class="nav-bottom">
      <button type="button" class="nav-item" data-action="theme" title="배경 바꾸기">
        <span class="tile theme-tile" style="--tile: var(--indigo)"><svg viewBox="0 0 24 24" class="theme-icon"></svg></span>
        <span class="nav-label">배경</span><span class="nav-count theme-label"></span>
      </button>
      <button type="button" class="nav-item" data-goto="trash" title="휴지통">
        <span class="tile" style="--tile: var(--gray)"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg></span>
        <span class="nav-label">휴지통</span><span class="nav-count" data-count="trash"></span>
      </button>
    </div>
  </aside>

  <!-- 각 화면이 이 안에 그려집니다 -->
  <main id="view" class="main"></main>

  <!-- 입력 창(모달)과 짧은 안내 메시지(토스트) 자리 -->
  <dialog id="modal"></dialog>
  <div id="toast" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
